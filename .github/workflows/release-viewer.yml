name: release-viewer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build tests
        run: dotnet build tests/SperryDev.Logger.Tests -m:1
      - name: Run tests
        run: dotnet test tests/SperryDev.Logger.Tests --no-build --output normal

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Publish viewer (win-x64, self-contained)
        run: >
          dotnet publish src/SperryDev.Logger.Viewer/SperryDev.Logger.Viewer.csproj
          -c Release -r win-x64 --self-contained true -o publish/viewer
      - name: Compile installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { (Get-Content version.json | ConvertFrom-Json).version }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" deploy\windows\SperryDev.Logger.Viewer.iss `
            "/DAppVersion=$version" `
            "/DViewerPublishDir=$((Resolve-Path publish/viewer).Path)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SperryDev.Logger.Viewer-Setup
          path: deploy/windows/bin/*.exe

  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SperryDev.Logger.Viewer-Setup
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" *.exe --title "$GITHUB_REF_NAME" --generate-notes
